<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue to your dashboard.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username or email</label>
        <input type="text" id="username" autocomplete="username" placeholder="e.g. example@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Your password">
      </div>

      <p id="message" class="message" role="alert"></p>

      <button type="submit" class="btn loginbtn">Login</button>
    </form>

    <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
</html>
